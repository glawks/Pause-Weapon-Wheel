name: windows-x64
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional existing release tag to publish or update (e.g. v1.0.0)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  windows-x86_64:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out OpenRAC SDK 1.14.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRAC/OpenRAC
          ref: sdk-v1.14.2
          path: .openrac
          persist-credentials: false
      - name: Verify OpenRAC SDK API 1.14
        run: |
          sdk_version_file=.openrac/sdk/cmake/OpenRACModConfigVersion.cmake
          test -f "$sdk_version_file"
          grep -Fq 'set(PACKAGE_VERSION "1.14")' "$sdk_version_file"
          echo 'Using OpenRAC SDK 1.14.2 (mod API 1.14)'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select and verify release tag
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          release_tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$REQUESTED_RELEASE_TAG"
          fi
          if [ -n "$release_tag" ]; then
            version=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
            if [ "$release_tag" != "v$version" ]; then
              echo "Release tag $release_tag does not match openrac-mod.json version $version"
              exit 1
            fi
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Ninja
        run: python -m pip install ninja
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (-not $vs) { throw "No Visual Studio installation found" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Configure
        run: cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DOpenRACMod_DIR="$GITHUB_WORKSPACE/.openrac/sdk/cmake"
      - name: Build
        run: cmake --build build-win --parallel
      - name: Package
        run: python .openrac/sdk/tools/package_mod.py build-win/package/* -o dist
      - name: Verify installable Windows package
        run: |
          version=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
          package="dist/weapon-wheel-pause-$version-windows-x86_64.zip"
          test -f "$package"
          python -c 'import sys,zipfile; names=set(zipfile.ZipFile(sys.argv[1]).namelist()); assert "openrac-mod.json" in names; assert "lib/windows-x86_64/weapon_wheel_pause.dll" in names' "$package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: weapon-wheel-pause-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
            gh release edit "$RELEASE_TAG" --title "Weapon Wheel Pause $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --verify-tag \
              --generate-notes \
              --title "Weapon Wheel Pause $RELEASE_TAG"
          fi

name: build
on:
  push:
    branches: [main, master, dev, android-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify manifest and SDK hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch checksum-pinned OpenRAC SDK
        run: python tools/fetch_sdk.py
      - name: Validate native version and declared hooks
        run: |
          SDK=$(python tools/fetch_sdk.py)
          python tests/release_preflight.py --sdk-header "$SDK/include/openrac/games/rac1.hpp"

  build:
    needs: preflight
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-2025}
          - {platform: linux-x86_64, runner: ubuntu-22.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          # Cross-compile ARM64 on Intel, as OpenRAC's upstream workflow does.
          # ARM64 test binaries cannot execute on this Intel runner.
          - {platform: macos-arm64, runner: macos-15-intel, arch: arm64, skip_tests: true}
          # Use the dedicated Intel runner instead of cross-building on Apple Silicon.
          - {platform: macos-x86_64, runner: macos-15-intel, arch: x86_64, skip_tests: true}
          # Cross-compile with the Android NDK. We cannot execute device tests in this runner.
          - platform: android-arm64
            runner: ubuntu-24.04
            configure: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
            skip_tests: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Download pinned OpenRAC SDK
        run: python tools/fetch_sdk.py
      - name: Configure
        run: |
          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            ARCH="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          fi
          TESTING=ON
          if [ "${{ matrix.skip_tests }}" = "true" ]; then TESTING=OFF; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING="$TESTING" $ARCH ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        if: ${{ !matrix.skip_tests }}
        run: ctest --test-dir build --output-on-failure
      - name: Package platform archive
        run: |
          SDK=$(python tools/fetch_sdk.py)
          python "$SDK/tools/package_mod.py" build/package/weapon_wheel_pause -o dist
          ls -la dist
          # Check OpenRAC's platform filename and the contained library.
          VERSION=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
          ZIP="dist/pause-weapon-wheel-$VERSION-${{ matrix.platform }}.zip"
          test -s "$ZIP"
          python - "$ZIP" "${{ matrix.platform }}" <<'PY'
          import sys, zipfile
          archive, platform = sys.argv[1:]
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              assert "openrac-mod.json" in names, names
              assert any(n.startswith(f"lib/{platform}/") and "weapon_wheel_pause" in n for n in names), names
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mod-*
          path: dist
          merge-multiple: true
      - name: Combine platform packages
        run: |
          SDK=$(python tools/fetch_sdk.py)
          VERSION=$(python -c 'import json; print(json.load(open("openrac-mod.json", encoding="utf-8"))["version"])')
          python "$SDK/tools/package_mod.py" --merge dist/pause-weapon-wheel-"$VERSION"-*.zip -o dist/pause-weapon-wheel-"$VERSION".zip
          for PLATFORM in windows-x86_64 linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 android-arm64; do
            test -s "dist/pause-weapon-wheel-$VERSION-$PLATFORM.zip"
          done
          test -s "dist/pause-weapon-wheel-$VERSION.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-release
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish new stable version
    needs: merge
    # Android-development, dev and manual workflow runs never publish releases.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pause-weapon-wheel-releases
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-release
          path: dist
      - name: Publish only when the manifest version is new and stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("openrac-mod.json", encoding="utf-8"))["version"])')
          TAG="v$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::Refusing to publish an experimental version from main: $VERSION"
            exit 1
          fi
          for PLATFORM in windows-x86_64 linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 android-arm64; do
            test -s "dist/pause-weapon-wheel-$VERSION-$PLATFORM.zip"
          done
          test -s "dist/pause-weapon-wheel-$VERSION.zip"
          test -s "dist/SHA256SUMS"
          (cd dist && sha256sum --check SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its tag, assets and metadata."
            exit 0
          fi
          gh release create "$TAG" --title "Weapon Wheel Pause $TAG" --target "$GITHUB_SHA" \
            --generate-notes --latest \
            dist/pause-weapon-wheel-"$VERSION"-*.zip \
            dist/pause-weapon-wheel-"$VERSION".zip dist/SHA256SUMS
